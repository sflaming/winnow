[project]
name = "winnow"
version = "0.1.0"
description = "A Textual TUI that finds photos on an SD card already copied to a destination drive, then reviews and quarantines the duplicates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exifread>=3.5.1",
    "pillow>=12.1.1",
    "rawpy<=0.25.1",
    "textual>=8.0.0",
    "textual-image[textual]>=0.8.5",
]
